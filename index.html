<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#FAFBFC" />
    <script>
      // Apply the saved palette before the first paint, including the page canvas.
      (() => {
        let theme = 'light'
        try { if (localStorage.getItem('ecic-theme') === 'dark') theme = 'dark' } catch { /* Storage may be unavailable. */ }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.documentElement.style.backgroundColor = theme === 'dark' ? '#181D21' : '#FAFBFC'
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#181D21' : '#FAFBFC'
      })()
    </script>
    <link rel="stylesheet" href="/src/theme.css" />
    <meta name="description" content="Clock-in ECIC, el nuevo espacio de asistencia docente de nuestra comunidad." />
    <title>Clock-in ECIC · Asistencia docente</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
